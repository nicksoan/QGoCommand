[workspace]
resolver = "2"
members = ["qgo-core", "qgo-app"]

[workspace.package]
version = "2.1.1"
edition = "2021"
rust-version = "1.85"
authors = ["Nick Soan"]
repository = "https://qgocommand.com/"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
percent-encoding = "2"
thiserror = "2"
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
