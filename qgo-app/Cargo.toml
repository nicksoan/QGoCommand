[package]
name = "qgo-app"
description = "QGo - keyboard-driven shortcut launcher (Rust/egui port of the WPF app)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[[bin]]
name = "qgo"
path = "src/main.rs"

[dependencies]
qgo-core = { path = "../qgo-core" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
log.workspace = true
env_logger = "0.11"

# `default-features = false` drops the accesskit/persistence extras; `glow` is
# the renderer, `wayland`/`x11` are irrelevant on the Windows target.
eframe = { version = "0.35", default-features = false, features = [
    "glow",
    "default_fonts",
] }
egui = "0.35"

# Both from the tauri-apps org, and both integrate with the winit event loop
# eframe already runs on the main thread.
global-hotkey = "0.8"
tray-icon = "0.24"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.dependencies.winit]
version = "0.30"
default-features = false
